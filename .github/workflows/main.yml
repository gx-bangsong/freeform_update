name: Verify APK
on:
  workflow_dispatch:
  push:
    paths:
      - "Mi-FreeForm-master/**"
      - ".github/workflows/verify-apk.yml"
permissions:
  contents: read
env:
  PROJECT_DIR: Mi-FreeForm-master
jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle
      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freeform-debug-apk
          path: "Mi-FreeForm-master/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

