name: Verify APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mi-FreeForm-master/**"
      - ".github/workflows/verify-apk.yml"

permissions:
  contents: read

env:
  PROJECT_DIR: Mi-FreeForm-master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
