name: Verify APK

on:
  workflow_dispatch:

  push:
    paths:
      - "Mi-FreeForm-master/**"
      - ".github/workflows/verify-apk.yml"

permissions:
  contents: read

env:
  PROJECT_DIR: Mi-FreeForm-master

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freeform-debug-apk
          path: "Mi-FreeForm-master/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
