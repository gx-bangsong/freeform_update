// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.4.10"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://maven.rikka.dev/repository/maven-releases/' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10"
        //bugly
        //classpath 'com.tencent.bugly:symtabfileuploader:latest.release'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://maven.rikka.dev/repository/maven-releases/' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
// Surface dependency/configuration failures in GitHub Checks, even when the
// runner's downloadable log storage is unreachable from the client.
if (System.getenv('GITHUB_ACTIONS') == 'true') {
    gradle.buildFinished { result ->
        if (result.failure != null) {
            def messages = []
            def failure = result.failure
            while (failure != null && messages.size() < 12) {
                messages.add(failure.message ?: failure.class.name)
                failure = failure.cause
            }
            def detail = messages.join('\nCaused by: ')
                .replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
            println "::error title=Gradle build failure::${detail}"
        }
    }
}
